name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishing releases (never granted to pull requests from forks)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APKs
        run: ./gradlew :full:assembleDebug :vanilla:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            full/build/outputs/apk/debug/*.apk
            vanilla/build/outputs/apk/debug/*.apk

      # Release signing: only in this repository, only when the encrypted secrets exist.
      # Pull requests (including from forks) never get here.
      - name: Prepare signing key
        id: sign
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.OPENMK3_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets configured: skipping release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openmk3-release.p12"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Signed release APKs
        if: steps.sign.outputs.enabled == 'true'
        env:
          OPENMK3_KEYSTORE: ${{ runner.temp }}/openmk3-release.p12
          OPENMK3_KEYSTORE_PASSWORD: ${{ secrets.OPENMK3_KEYSTORE_PASSWORD }}
          OPENMK3_KEY_ALIAS: ${{ secrets.OPENMK3_KEY_ALIAS }}
          OPENMK3_KEY_PASSWORD: ${{ secrets.OPENMK3_KEY_PASSWORD }}
        run: |
          ./gradlew :full:assembleRelease :vanilla:assembleRelease --stacktrace
          cp full/build/outputs/apk/release/full-release.apk open-mk3.apk
          cp vanilla/build/outputs/apk/release/vanilla-release.apk open-mk3-vanilla.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openmk3-release.p12"

      - name: Publish "latest" pre-release (main)
        if: steps.sign.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest open-mk3.apk open-mk3-vanilla.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of main. open-mk3.apk = Open MK3, open-mk3-vanilla.apk = Open MK3 Vanilla."

      - name: Publish tagged release
        if: steps.sign.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" open-mk3.apk open-mk3-vanilla.apk \
            --title "Open MK3 $GITHUB_REF_NAME" --generate-notes
